# OAUTH2 DUMMY PARA TESTES
# Removemos o issuer-uri para evitar o erro de parsing do {tenantid}
# E definimos URIs manuais para enganar a validação do Spring na subida
spring.security.oauth2.client.registration.azure.client-id=dummy-id
spring.security.oauth2.client.registration.azure.client-secret=dummy-secret
spring.security.oauth2.client.registration.azure.scope=openid,profile,email
spring.security.oauth2.client.registration.azure.redirect-uri={baseUrl}/login/oauth2/code/azure
spring.security.oauth2.client.registration.azure.authorization-grant-type=authorization_code

# Configuração manual do Provider (evita chamada externa ao .well-known)
spring.security.oauth2.client.provider.azure.authorization-uri=http://localhost:8080/oauth2/authorize
spring.security.oauth2.client.provider.azure.token-uri=http://localhost:8080/oauth2/token
spring.security.oauth2.client.provider.azure.user-info-uri=http://localhost:8080/oauth2/userinfo
spring.security.oauth2.client.provider.azure.jwk-set-uri=http://localhost:8080/oauth2/jwks
spring.security.oauth2.client.provider.azure.user-name-attribute=name